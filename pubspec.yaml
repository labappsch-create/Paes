name: paes_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  in_app_purchase: ^3.3.1
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/images/m1/
    - assets/images/m2/
    - assets/images/ciencias/
    - assets/images/historia/
    - assets/images/lectora/
    - assets/branding/logo_retopaes.png
    - assets/legal/politica_privacidad.md
    - assets/branding/icono_app.png

# Ícono de la app (logo de Retopaes). Para regenerarlo: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icono_app.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icono_app.png"

# Pantalla de bienvenida al abrir la app. Para regenerarla: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_android12.png
  android: true
  ios: true
  web: false
